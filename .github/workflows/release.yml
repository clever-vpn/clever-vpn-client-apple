name: Release Apple Apps

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional version (for example 1.3.3, v1.3.3, 1.3.3-rc.1). Leave empty to auto bump patch from latest release.
        required: false
        default: ''
        type: string
      publish_developer_id:
        description: Build, notarize, and publish the CleverVpnEx DMG.
        required: true
        default: true
        type: boolean
      publish_app_store:
        description: Archive and upload CleverVpn to App Store Connect for iOS and macOS.
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare version
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      raw_version: ${{ steps.version.outputs.raw_version }}
      is_rc: ${{ steps.version.outputs.is_rc }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - name: Enforce main branch only
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "This workflow can only be dispatched from main. Current ref: ${GITHUB_REF}" >&2
            exit 1
          fi

      - name: Normalize version input
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          INPUT_VERSION="${{ inputs.version }}"
          RAW="${INPUT_VERSION#v}"

          if [[ -z "${RAW}" ]]; then
            LATEST_TAG="$(gh api repos/${{ github.repository }}/releases/latest --jq '.tag_name' 2>/dev/null || echo 'v0.0.0')"
            LATEST_RAW="${LATEST_TAG#v}"

            if [[ "${LATEST_RAW}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              MAJOR="${BASH_REMATCH[1]}"
              MINOR="${BASH_REMATCH[2]}"
              PATCH="${BASH_REMATCH[3]}"
            elif [[ "${LATEST_RAW}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)-rc\.([0-9]+)$ ]]; then
              MAJOR="${BASH_REMATCH[1]}"
              MINOR="${BASH_REMATCH[2]}"
              PATCH="${BASH_REMATCH[3]}"
            else
              echo "latest tag ${LATEST_TAG} is not a supported semver base" >&2
              exit 1
            fi

            RAW="${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi

          if [[ "${RAW}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            IS_RC="true"
          elif [[ "${RAW}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            IS_RC="false"
          else
            echo "unsupported version format: ${RAW}" >&2
            echo "supported: x.y.z or x.y.z-rc.n" >&2
            exit 1
          fi

          RELEASE_TAG="v${RAW}"

          echo "raw_version=${RAW}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "is_rc=${IS_RC}" >> "$GITHUB_OUTPUT"
          echo "build_number=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  developer_id_dmg:
    name: Build Developer ID DMG
    runs-on: macos-15
    needs: prepare
    if: ${{ inputs.publish_developer_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Bitwarden wiring
        shell: bash
        env:
          BW_SM_ACCESS_TOKEN: ${{ secrets.BW_SM_ACCESS_TOKEN }}
          BW_SECRET_ID_DEVELOPER_ID_P12_BASE64: ${{ vars.BW_SECRET_ID_DEVELOPER_ID_P12_BASE64 }}
          BW_SECRET_ID_DEVELOPER_ID_P12_PASSWORD: ${{ vars.BW_SECRET_ID_DEVELOPER_ID_P12_PASSWORD }}
          BW_SECRET_ID_ASC_KEY_ID: ${{ vars.BW_SECRET_ID_ASC_KEY_ID }}
          BW_SECRET_ID_ASC_ISSUER_ID: ${{ vars.BW_SECRET_ID_ASC_ISSUER_ID }}
          BW_SECRET_ID_ASC_API_KEY_P8_BASE64: ${{ vars.BW_SECRET_ID_ASC_API_KEY_P8_BASE64 }}
          BW_SECRET_ID_MACOS_APP_PROFILE_BASE64: ${{ vars.BW_SECRET_ID_MACOS_APP_PROFILE_BASE64 }}
          BW_SECRET_ID_MACOS_SYSTEM_EXTENSION_PROFILE_BASE64: ${{ vars.BW_SECRET_ID_MACOS_SYSTEM_EXTENSION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          required_vars=(
            BW_SM_ACCESS_TOKEN
            BW_SECRET_ID_DEVELOPER_ID_P12_BASE64
            BW_SECRET_ID_DEVELOPER_ID_P12_PASSWORD
            BW_SECRET_ID_ASC_KEY_ID
            BW_SECRET_ID_ASC_ISSUER_ID
            BW_SECRET_ID_ASC_API_KEY_P8_BASE64
            BW_SECRET_ID_MACOS_APP_PROFILE_BASE64
            BW_SECRET_ID_MACOS_SYSTEM_EXTENSION_PROFILE_BASE64
          )

          if [[ ! -f Config/Developer.xcconfig ]]; then
            echo "Missing required repository file: Config/Developer.xcconfig" >&2
            exit 1
          fi

          for required_var in "${required_vars[@]}"; do
            if [[ -z "${!required_var:-}" ]]; then
              echo "Missing required GitHub secret/variable: ${required_var}" >&2
              exit 1
            fi
          done

      - name: Load Apple signing secrets from Bitwarden
        uses: bitwarden/sm-action@v3.0.0
        with:
          access_token: ${{ secrets.BW_SM_ACCESS_TOKEN }}
          cloud_region: ${{ vars.BW_CLOUD_REGION || 'us' }}
          secrets: |
            ${{ vars.BW_SECRET_ID_DEVELOPER_ID_P12_BASE64 }} > DEVELOPER_ID_P12_BASE64
            ${{ vars.BW_SECRET_ID_DEVELOPER_ID_P12_PASSWORD }} > DEVELOPER_ID_P12_PASSWORD
            ${{ vars.BW_SECRET_ID_ASC_KEY_ID }} > ASC_KEY_ID
            ${{ vars.BW_SECRET_ID_ASC_ISSUER_ID }} > ASC_ISSUER_ID
            ${{ vars.BW_SECRET_ID_ASC_API_KEY_P8_BASE64 }} > ASC_API_KEY_P8_BASE64
            ${{ vars.BW_SECRET_ID_MACOS_APP_PROFILE_BASE64 }} > MACOS_APP_PROFILE_BASE64
            ${{ vars.BW_SECRET_ID_MACOS_SYSTEM_EXTENSION_PROFILE_BASE64 }} > MACOS_SYSTEM_EXTENSION_PROFILE_BASE64

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Prepare build configuration
        shell: bash
        env:
          RAW_VERSION: ${{ needs.prepare.outputs.raw_version }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
        run: |
          set -euo pipefail
          ./scripts/update_xcode_version.sh --version "$RAW_VERSION" --build "$BUILD_NUMBER"
          ./scripts/sync_clever_vpn_kit_version.sh

          if [[ -f Config/Developer.xcconfig ]]; then
            echo "Using existing Config/Developer.xcconfig"
          else
            echo "Missing required repository file: Config/Developer.xcconfig" >&2
            exit 1
          fi

          DEVELOPMENT_TEAM="$(sed -n 's/^DEVELOPMENT_TEAM[[:space:]]*=[[:space:]]*//p' Config/Developer.xcconfig | head -1 | tr -d '[:space:]')"
          if [[ -z "$DEVELOPMENT_TEAM" ]]; then
            echo "Failed to read DEVELOPMENT_TEAM from Config/Developer.xcconfig" >&2
            exit 1
          fi
          echo "APPLE_DEVELOPMENT_TEAM=$DEVELOPMENT_TEAM" >> "$GITHUB_ENV"

      - name: Install certificates and provisioning profiles
        shell: bash
        env:
          DEVELOPER_ID_P12_BASE64: ${{ env.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ env.DEVELOPER_ID_P12_PASSWORD }}
          MACOS_APP_PROFILE_BASE64: ${{ env.MACOS_APP_PROFILE_BASE64 }}
          MACOS_SYSTEM_EXTENSION_PROFILE_BASE64: ${{ env.MACOS_SYSTEM_EXTENSION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/ci-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          APP_PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles/clevervpn-appex.provisionprofile"
          SYSTEMEXT_PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles/clevervpn-systemextension.provisionprofile"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 -D > "$CERT_PATH"
          printf '%s' "$MACOS_APP_PROFILE_BASE64" | base64 -D > "$APP_PROFILE_PATH"
          printf '%s' "$MACOS_SYSTEM_EXTENSION_PROFILE_BASE64" | base64 -D > "$SYSTEMEXT_PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Archive CleverVpnEx
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project CleverVpn.xcodeproj \
            -scheme CleverVpnEx \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/CleverVpnEx.xcarchive" \
            archive

      - name: Build DMG and notarize
        id: dmg
        shell: bash
        env:
          ASC_KEY_ID: ${{ env.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ env.ASC_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ env.ASC_API_KEY_P8_BASE64 }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/CleverVpnEx.xcarchive/Products/Applications/CleverVpnEx.app"
          STAGE_DIR="$RUNNER_TEMP/dmg-stage"
          DMG_PATH="$RUNNER_TEMP/CleverVpnEx-${RELEASE_TAG}.dmg"
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"

          codesign --verify --deep --strict "$APP_PATH"
          mkdir -p "$STAGE_DIR" "$KEY_DIR"
          rm -rf "$STAGE_DIR/CleverVpnEx.app"
          ditto "$APP_PATH" "$STAGE_DIR/CleverVpnEx.app"

          hdiutil create \
            -volname "Clever VPN" \
            -srcfolder "$STAGE_DIR" \
            -ov \
            -format UDZO \
            "$DMG_PATH"

          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 -D > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

          xcrun notarytool submit "$DMG_PATH" \
            --key "$KEY_PATH" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --wait

          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"

          echo "dmg_path=$DMG_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: developer-id-dmg
          path: ${{ steps.dmg.outputs.dmg_path }}
          retention-days: 7

  app_store:
    name: Upload to App Store Connect
    runs-on: macos-15
    needs: prepare
    if: ${{ inputs.publish_app_store }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Bitwarden wiring
        shell: bash
        env:
          BW_SM_ACCESS_TOKEN: ${{ secrets.BW_SM_ACCESS_TOKEN }}
          BW_SECRET_ID_APPLE_DISTRIBUTION_P12_BASE64: ${{ vars.BW_SECRET_ID_APPLE_DISTRIBUTION_P12_BASE64 }}
          BW_SECRET_ID_APPLE_DISTRIBUTION_P12_PASSWORD: ${{ vars.BW_SECRET_ID_APPLE_DISTRIBUTION_P12_PASSWORD }}
          BW_SECRET_ID_ASC_KEY_ID: ${{ vars.BW_SECRET_ID_ASC_KEY_ID }}
          BW_SECRET_ID_ASC_ISSUER_ID: ${{ vars.BW_SECRET_ID_ASC_ISSUER_ID }}
          BW_SECRET_ID_ASC_API_KEY_P8_BASE64: ${{ vars.BW_SECRET_ID_ASC_API_KEY_P8_BASE64 }}
          BW_SECRET_ID_IOS_APP_STORE_PROFILE_BASE64: ${{ vars.BW_SECRET_ID_IOS_APP_STORE_PROFILE_BASE64 }}
          BW_SECRET_ID_IOS_EXTENSION_APP_STORE_PROFILE_BASE64: ${{ vars.BW_SECRET_ID_IOS_EXTENSION_APP_STORE_PROFILE_BASE64 }}
          BW_SECRET_ID_MACOS_APP_STORE_PROFILE_BASE64: ${{ vars.BW_SECRET_ID_MACOS_APP_STORE_PROFILE_BASE64 }}
          BW_SECRET_ID_MACOS_EXTENSION_APP_STORE_PROFILE_BASE64: ${{ vars.BW_SECRET_ID_MACOS_EXTENSION_APP_STORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          required_vars=(
            BW_SM_ACCESS_TOKEN
            BW_SECRET_ID_APPLE_DISTRIBUTION_P12_BASE64
            BW_SECRET_ID_APPLE_DISTRIBUTION_P12_PASSWORD
            BW_SECRET_ID_ASC_KEY_ID
            BW_SECRET_ID_ASC_ISSUER_ID
            BW_SECRET_ID_ASC_API_KEY_P8_BASE64
            BW_SECRET_ID_IOS_APP_STORE_PROFILE_BASE64
            BW_SECRET_ID_IOS_EXTENSION_APP_STORE_PROFILE_BASE64
            BW_SECRET_ID_MACOS_APP_STORE_PROFILE_BASE64
            BW_SECRET_ID_MACOS_EXTENSION_APP_STORE_PROFILE_BASE64
          )

          if [[ ! -f Config/Developer.xcconfig ]]; then
            echo "Missing required repository file: Config/Developer.xcconfig" >&2
            exit 1
          fi

          for required_var in "${required_vars[@]}"; do
            if [[ -z "${!required_var:-}" ]]; then
              echo "Missing required GitHub secret/variable: ${required_var}" >&2
              exit 1
            fi
          done

      - name: Load App Store secrets from Bitwarden
        uses: bitwarden/sm-action@v3.0.0
        with:
          access_token: ${{ secrets.BW_SM_ACCESS_TOKEN }}
          cloud_region: ${{ vars.BW_CLOUD_REGION || 'us' }}
          secrets: |
            ${{ vars.BW_SECRET_ID_APPLE_DISTRIBUTION_P12_BASE64 }} > APPLE_DISTRIBUTION_P12_BASE64
            ${{ vars.BW_SECRET_ID_APPLE_DISTRIBUTION_P12_PASSWORD }} > APPLE_DISTRIBUTION_P12_PASSWORD
            ${{ vars.BW_SECRET_ID_ASC_KEY_ID }} > ASC_KEY_ID
            ${{ vars.BW_SECRET_ID_ASC_ISSUER_ID }} > ASC_ISSUER_ID
            ${{ vars.BW_SECRET_ID_ASC_API_KEY_P8_BASE64 }} > ASC_API_KEY_P8_BASE64
            ${{ vars.BW_SECRET_ID_IOS_APP_STORE_PROFILE_BASE64 }} > IOS_APP_STORE_PROFILE_BASE64
            ${{ vars.BW_SECRET_ID_IOS_EXTENSION_APP_STORE_PROFILE_BASE64 }} > IOS_EXTENSION_APP_STORE_PROFILE_BASE64
            ${{ vars.BW_SECRET_ID_MACOS_APP_STORE_PROFILE_BASE64 }} > MACOS_APP_STORE_PROFILE_BASE64
            ${{ vars.BW_SECRET_ID_MACOS_EXTENSION_APP_STORE_PROFILE_BASE64 }} > MACOS_EXTENSION_APP_STORE_PROFILE_BASE64

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Prepare build configuration
        shell: bash
        env:
          RAW_VERSION: ${{ needs.prepare.outputs.raw_version }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
        run: |
          set -euo pipefail
          ./scripts/update_xcode_version.sh --version "$RAW_VERSION" --build "$BUILD_NUMBER"
          ./scripts/sync_clever_vpn_kit_version.sh

          if [[ -f Config/Developer.xcconfig ]]; then
            echo "Using existing Config/Developer.xcconfig"
          else
            echo "Missing required repository file: Config/Developer.xcconfig" >&2
            exit 1
          fi

          DEVELOPMENT_TEAM="$(sed -n 's/^DEVELOPMENT_TEAM[[:space:]]*=[[:space:]]*//p' Config/Developer.xcconfig | head -1 | tr -d '[:space:]')"
          APP_ID="$(sed -n 's/^APP_ID[[:space:]]*=[[:space:]]*//p' Config/Developer.xcconfig | head -1 | tr -d '[:space:]')"
          APP_ID_MACOSEX="$(sed -n 's/^APP_ID_MACOSEX[[:space:]]*=[[:space:]]*//p' Config/Developer.xcconfig | head -1 | tr -d '[:space:]')"
          if [[ -z "$DEVELOPMENT_TEAM" ]]; then
            echo "Failed to read DEVELOPMENT_TEAM from Config/Developer.xcconfig" >&2
            exit 1
          fi
          if [[ -z "$APP_ID" || -z "$APP_ID_MACOSEX" ]]; then
            echo "Failed to read APP_ID or APP_ID_MACOSEX from Config/Developer.xcconfig" >&2
            exit 1
          fi
          echo "APPLE_DEVELOPMENT_TEAM=$DEVELOPMENT_TEAM" >> "$GITHUB_ENV"
          echo "APPLE_APP_ID=$APP_ID" >> "$GITHUB_ENV"
          echo "APPLE_APP_ID_MACOSEX=$APP_ID_MACOSEX" >> "$GITHUB_ENV"

      - name: Install App Store signing assets
        shell: bash
        env:
          APPLE_DISTRIBUTION_P12_BASE64: ${{ env.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ env.APPLE_DISTRIBUTION_P12_PASSWORD }}
          ASC_KEY_ID: ${{ env.ASC_KEY_ID }}
          ASC_API_KEY_P8_BASE64: ${{ env.ASC_API_KEY_P8_BASE64 }}
          IOS_APP_STORE_PROFILE_BASE64: ${{ env.IOS_APP_STORE_PROFILE_BASE64 }}
          IOS_EXTENSION_APP_STORE_PROFILE_BASE64: ${{ env.IOS_EXTENSION_APP_STORE_PROFILE_BASE64 }}
          MACOS_APP_STORE_PROFILE_BASE64: ${{ env.MACOS_APP_STORE_PROFILE_BASE64 }}
          MACOS_EXTENSION_APP_STORE_PROFILE_BASE64: ${{ env.MACOS_EXTENSION_APP_STORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/ci-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/apple-distribution.p12"
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"

          mkdir -p "$KEY_DIR" "$PROFILE_DIR"
          printf '%s' "$APPLE_DISTRIBUTION_P12_BASE64" | base64 -D > "$CERT_PATH"
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 -D > "$KEY_PATH"
          printf '%s' "$IOS_APP_STORE_PROFILE_BASE64" | base64 -D > "$PROFILE_DIR/ios-app-store.mobileprovision"
          printf '%s' "$IOS_EXTENSION_APP_STORE_PROFILE_BASE64" | base64 -D > "$PROFILE_DIR/ios-extension-app-store.mobileprovision"
          printf '%s' "$MACOS_APP_STORE_PROFILE_BASE64" | base64 -D > "$PROFILE_DIR/macos-app-store.provisionprofile"
          printf '%s' "$MACOS_EXTENSION_APP_STORE_PROFILE_BASE64" | base64 -D > "$PROFILE_DIR/macos-extension-app-store.provisionprofile"
          chmod 600 "$KEY_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_DISTRIBUTION_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Archive and export iOS build
        shell: bash
        env:
          ASC_KEY_ID: ${{ env.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ env.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          EXPORT_PLIST="$RUNNER_TEMP/ExportOptions-iOS.plist"

          if [[ -z "${APPLE_DEVELOPMENT_TEAM:-}" ]]; then
            echo "APPLE_DEVELOPMENT_TEAM is empty before iOS export" >&2
            exit 1
          fi

          cat > "$EXPORT_PLIST" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "https://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>teamID</key>
            <string>${APPLE_DEVELOPMENT_TEAM}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${APPLE_APP_ID}</key>
              <string>iOS Team Store Provisioning Profile: ${APPLE_APP_ID}</string>
              <key>${APPLE_APP_ID}.network-extension</key>
              <string>iOS Team Store Provisioning Profile: ${APPLE_APP_ID}.network-extension</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          xcodebuild \
            -project CleverVpn.xcodeproj \
            -scheme CleverVpn \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/CleverVpn-iOS.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/CleverVpn-iOS.xcarchive" \
            -exportPath "$RUNNER_TEMP/export-ios" \
            -exportOptionsPlist "$EXPORT_PLIST" \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Archive and export macOS App Store build
        shell: bash
        env:
          ASC_KEY_ID: ${{ env.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ env.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          EXPORT_PLIST="$RUNNER_TEMP/ExportOptions-macOS.plist"

          if [[ -z "${APPLE_DEVELOPMENT_TEAM:-}" ]]; then
            echo "APPLE_DEVELOPMENT_TEAM is empty before macOS export" >&2
            exit 1
          fi

          cat > "$EXPORT_PLIST" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "https://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>teamID</key>
            <string>${APPLE_DEVELOPMENT_TEAM}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${APPLE_APP_ID}</key>
              <string>Mac Team Store Provisioning Profile: ${APPLE_APP_ID}</string>
              <key>${APPLE_APP_ID}.network-extension</key>
              <string>Mac Team Store Provisioning Profile: ${APPLE_APP_ID}.network-extension</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          xcodebuild \
            -project CleverVpn.xcodeproj \
            -scheme CleverVpn \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/CleverVpn-macOS.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$APPLE_DEVELOPMENT_TEAM" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            "CODE_SIGN_IDENTITY[sdk=macosx*]=Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER= \
            "PROVISIONING_PROFILE_SPECIFIER[sdk=macosx*]=" \
            archive

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/CleverVpn-macOS.xcarchive" \
            -exportPath "$RUNNER_TEMP/export-macos" \
            -exportOptionsPlist "$EXPORT_PLIST" \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload builds to App Store Connect
        shell: bash
        env:
          ASC_KEY_ID: ${{ env.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ env.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA_PATH="$(find "$RUNNER_TEMP/export-ios" -maxdepth 1 -name '*.ipa' -print -quit)"
          PKG_PATH="$(find "$RUNNER_TEMP/export-macos" -maxdepth 1 -name '*.pkg' -print -quit)"

          if [[ -z "${IPA_PATH}" ]]; then
            echo "Failed to locate exported .ipa" >&2
            exit 1
          fi

          if [[ -z "${PKG_PATH}" ]]; then
            echo "Failed to locate exported .pkg" >&2
            exit 1
          fi

          xcrun altool --upload-app --type ios -f "$IPA_PATH" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" --verbose
          xcrun altool --upload-app --type osx -f "$PKG_PATH" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" --verbose

      - name: Upload App Store artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-store-exports
          path: |
            ${{ runner.temp }}/export-ios/*.ipa
            ${{ runner.temp }}/export-macos/*.pkg
          retention-days: 7

  github_release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - prepare
      - developer_id_dmg
      - app_store
    if: ${{ always() && needs.prepare.result == 'success' && (needs.developer_id_dmg.result == 'success' || needs.developer_id_dmg.result == 'skipped') && (needs.app_store.result == 'success' || needs.app_store.result == 'skipped') }}
    steps:
      - name: Sync release tag to workflow commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if gh api repos/${{ github.repository }}/git/ref/tags/${RELEASE_TAG} >/dev/null 2>&1; then
            gh api \
              --method PATCH \
              repos/${{ github.repository }}/git/refs/tags/${RELEASE_TAG} \
              -f sha="${TARGET_SHA}" \
              -F force=true >/dev/null
          else
            gh api repos/${{ github.repository }}/git/refs \
              -f ref="refs/tags/${RELEASE_TAG}" \
              -f sha="${TARGET_SHA}" >/dev/null
          fi

      - name: Download DMG artifact
        if: needs.developer_id_dmg.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: developer-id-dmg
          path: dist

      - name: Build release notes
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RAW_VERSION: ${{ needs.prepare.outputs.raw_version }}
          DEVELOPER_ID_RESULT: ${{ needs.developer_id_dmg.result }}
          APP_STORE_RESULT: ${{ needs.app_store.result }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          Release ${RELEASE_TAG}

          Version: ${RAW_VERSION}
          Developer ID DMG: ${DEVELOPER_ID_RESULT}
          App Store upload: ${APP_STORE_RESULT}
          EOF

      - name: Create or update GitHub release with DMG
        if: needs.developer_id_dmg.result == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ needs.prepare.outputs.release_tag }}
          body_path: release-notes.md
          prerelease: ${{ needs.prepare.outputs.is_rc == 'true' }}
          make_latest: ${{ needs.prepare.outputs.is_rc != 'true' }}
          files: dist/*.dmg

      - name: Create or update GitHub release metadata
        if: needs.developer_id_dmg.result != 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ needs.prepare.outputs.release_tag }}
          body_path: release-notes.md
          prerelease: ${{ needs.prepare.outputs.is_rc == 'true' }}
          make_latest: ${{ needs.prepare.outputs.is_rc != 'true' }}